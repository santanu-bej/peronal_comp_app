name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # surface the cause as a public check annotation (readable without log access)
            msg=$(grep -n -A25 "What went wrong" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=APK build failed::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: goal-compass-apk, path: build/app/outputs/flutter-apk/app-release.apk }
